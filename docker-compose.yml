version: "3.9"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: bookstore
      POSTGRES_PASSWORD: books1234
      POSTGRES_DB: bookstore
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build:
      context: ./packages/api
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://bookstore:books1234@db:5432/bookstore
      # Add other environment variables as needed
    ports:
      - "8080:8080"
    depends_on:
      - db
    restart: on-failure

volumes:
  pgdata: